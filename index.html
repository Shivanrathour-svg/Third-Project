<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Aapki Tailwind output file -->
    <link rel="stylesheet" href="output.css">
    <!-- Custom styling agar karni ho -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans antialiased selection:bg-red-600 selection:text-white">

    <!-- Navbar Section -->
    <header class="border-b border-gray-900 bg-gray-900/40 backdrop-blur-md sticky top-0 z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            
            <!-- Main Title (Movie Hub) -->
            <h1 class="text-3xl font-extrabold tracking-wider text-red-600 uppercase hover:opacity-90 transition cursor-pointer">
                Movie<span class="text-white font-normal">Hub</span>
            </h1>
            
            <!-- Form Layer with Input and Button (Aapki IDs ke sath) -->
            <form action="" id="searchMovie" class="relative w-full sm:w-96 flex items-center gap-2">
                <div class="relative w-full">
                    <input type="text" id="movieInput" placeholder="Search movies, TV shows..." 
                           class="w-full bg-gray-900/80 text-white pl-4 pr-4 py-2.5 rounded-xl border border-gray-800 focus:outline-none focus:border-red-600 focus:ring-2 focus:ring-red-600/20 text-sm placeholder-gray-500 transition-all duration-200">
                </div>
                <button type="submit" class="bg-red-600 hover:bg-red-700 active:scale-95 text-white px-5 py-2.5 rounded-xl text-sm font-semibold tracking-wide transition-all duration-200 shadow-lg shadow-red-600/10 cursor-pointer">
                    Search
                </button>
            </form>
            
        </div>
    </header>

    <!-- Main Container Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10" >
        
        <!-- Results Label -->
        <div class="flex items-center justify-between mb-8">
            <h2 class="text-lg font-medium text-gray-400 tracking-wide uppercase border-l-2 border-red-600 pl-3">Explore Titles</h2>
        </div>

        <!-- Movie Grid Showcase (Aapki JavaScript se dynamic data yahan load hoga) -->
        <div id="moviehub" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-y-10 gap-x-6">
            <!-- JavaScript se innerHTML ke cards yahan aane chahiye -->
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
